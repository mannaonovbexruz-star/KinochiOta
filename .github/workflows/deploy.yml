# ====================================
# GitHub Actions: CI + Render Deploy
# ====================================
# Bu workflow har safar main branch'ga push qilinganda:
# 1. Python 3.12 da kodni tekshiradi (sintaksis, import)
# 2. Agar testlar o'tsa, Render Deploy Hook orqali avtomatik deploy qiladi
#
# ⚠️ MUHIM: Bot fayllari GitHub repo ROOT'ida joylashgan
# (config.py, main.py, requirements.txt repo ildizida) — shuning uchun
# barcha komandalar root'da ishlaydi. 'KinochiOta/' papka emas, submodule edi!
#
# ⚠️ SOZLASH:
# 1. GitHub repo → Settings → Secrets and variables → Actions
# 2. New secret: RENDER_DEPLOY_HOOK_URL
#    Qiymat: Render Dashboard → Service → Settings → Deploy Hook URL
# 3. Boshqa secret kerak emas!

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Python syntax check
        run: |
          python -m compileall -q bot.py config.py handlers database scripts main.py
          echo "✅ Barcha fayllar sintaksis to'g'ri"

      - name: 🔌 Module import test
        env:
          # ⚠️ Bu yerga HAQIQIY token yozilmaydi! config.py import paytida
          # hech narsa talab qilmaydi (tekshiruv bot.py dagi validate() da),
          # shuning uchun soxta qiymat yetarli.
          BOT_TOKEN: "111111:TEST-TOKEN-NOT-REAL"
          ADMIN_ID: "1"
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "test-key"
        run: |
          python -c "
import config
from handlers import register_routers
from aiogram import Dispatcher
from aiogram.fsm.storage.memory import MemoryStorage
dp = Dispatcher(storage=MemoryStorage())
register_routers(dp)
print('✅ config + routerlar muvaffaqiyatli yuklandi:', [r.name for r in dp.sub_routers])
"
          echo "✅ Barcha importlar muvaffaqiyatli"

      - name: 🔐 Admin xavfsizlik testlari
        run: |
          python tests/test_admin_access.py
          python tests/test_admin_dashboard.py
          python tests/test_reply_keyboard.py
          python tests/test_retry.py
          python tests/test_subscription.py

  # ⚠️ RENDER DEPLOY O'CHIRILGAN
  # Bot endi Railway'da (polling rejimida) ishlaydi. Render bir vaqtda
  # ishga tushsa, bitta token bilan ikkita polling bo'lib Telegram
  # `409 Conflict` qaytaradi va IKKALA bot ham ishlamay qoladi.
  #
  # Render'ni qaytadan yoqmoqchi bo'lsangiz: `if: false` ni olib tashlang
  # VA avval Railway servisini to'xtating.
  deploy:
    name: 🚀 Render Deploy (o'chirilgan)
    needs: test
    if: false
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Trigger Render Deploy Hook
        env:
          RENDER_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK_URL" ]; then
            echo "❌ XATOLIK: RENDER_DEPLOY_HOOK_URL secret'i topilmadi!"
            echo "👉 GitHub repo → Settings → Secrets and variables → Actions"
            echo "👉 New repository secret → RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          
          echo "📤 Render deploy trigger yuborilmoqda..."
          HTTP_CODE=$(curl -s -o /tmp/render-response.json -w "%{http_code}" -X POST "$RENDER_HOOK_URL")
          
          if [ "$HTTP_CODE" = "200" ]; then
            DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/render-response.json')).get('id', 'unknown'))" 2>/dev/null)
            echo "✅ Deploy boshlandi! ID: $DEPLOY_ID"
            echo "👉 https://dashboard.render.com"
          elif [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Deploy navbatga qo'yildi (boshqa deploy davom etmoqda)"
          else
            echo "❌ Xatolik! HTTP: $HTTP_CODE"
            cat /tmp/render-response.json 2>/dev/null
            exit 1
          fi
